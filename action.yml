name: Yukh Projects dry-run
description: Produce a bounded, redacted reconciliation plan without mutations
inputs:
  github-token:
    description: GitHub credential with the required read access
    required: true
  owner:
    description: GitHub owner login
    required: true
  repository:
    description: GitHub repository name
    required: true
  project-number:
    description: GitHub Project number
    required: true
  issue-number:
    description: GitHub issue number
    required: true
  policy-path:
    description: Workspace-relative policy path
    required: false
    default: .yukh/project.yaml
  mode:
    description: Native policy dry-run or bounded version-1 legacy shadow adapter
    required: false
    default: native
outputs:
  status:
    description: success or error
  executable:
    description: Whether the plan is executable
  plan-id:
    description: Deterministic plan digest
  operation-count:
    description: Number of planned operations
  report-path:
    description: Absolute path to the redacted runner-temporary report
runs:
  using: node24
  main: dist/action/index.js
