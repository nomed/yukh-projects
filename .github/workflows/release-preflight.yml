name: Protected release preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.sha }}
  cancel-in-progress: false

jobs:
  would-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Validate candidate without publication authority
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${RELEASE_TOKEN:-}"
          test -z "${IMMUTABLE_RELEASES_READ_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          npm ci --ignore-scripts
          npm test
          npm run verify:bundles
          npm audit --audit-level=moderate
          mkdir -p release-qualification/assets
          node scripts/assemble-release-assets.mjs release-qualification/assets
          cp release/1.8.0/release-manifest.json release-qualification/release-manifest.json
      - name: Upload read-only qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qualification-${{ github.sha }}
          path: release-qualification/
          if-no-files-found: error
          retention-days: 1
