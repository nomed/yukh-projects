name: Release publication

on:
  push:
    branches: [main]
    paths: [.release-please-manifest.json]

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Bind merged Release Please candidate
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.["."]' .release-please-manifest.json)"
          case "$version" in ''|*[!0-9.]*) exit 1 ;; esac
          test "$(printf '%s' "$version" | awk -F. 'NF == 3 && $1 ~ /^(0|[1-9][0-9]*)$/ && $2 ~ /^(0|[1-9][0-9]*)$/ && $3 ~ /^(0|[1-9][0-9]*)$/ { print "ok" }')" = ok
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build exact candidate
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${#RELEASE_COMMIT}" -eq 40
          case "$RELEASE_COMMIT" in *[!0-9a-f]*) exit 1 ;; esac
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          node scripts/check-immutable-releases.mjs
          npm ci
          npm test
          npm run verify:bundles
          npm audit --audit-level=moderate
          npm sbom --sbom-format spdx > release.spdx.json
          node scripts/release-preflight.mjs "$RELEASE_VERSION" "$RELEASE_COMMIT" > would-publish.json
          mkdir release-assets
          cp RELEASE_NOTES.md "release-assets/yukh-projects-release-notes-${RELEASE_VERSION}.md"
          cp action.yml "release-assets/yukh-projects-action-${RELEASE_VERSION}.yml"
          cp apply-action.yml "release-assets/yukh-projects-apply-action-${RELEASE_VERSION}.yml"
          cp dist/action/index.js "release-assets/yukh-projects-action-${RELEASE_VERSION}.js"
          cp dist/apply/action.js "release-assets/yukh-projects-apply-action-${RELEASE_VERSION}.js"
          cp dist/apply/cli.js "release-assets/yukh-projects-apply-cli-${RELEASE_VERSION}.js"
          cp dist/apply/index.js "release-assets/yukh-projects-apply-library-${RELEASE_VERSION}.js"
          cp dist/apply/manifest.json "release-assets/yukh-projects-apply-manifest-${RELEASE_VERSION}.json"
          cp dist/cli/index.js "release-assets/yukh-projects-cli-${RELEASE_VERSION}.js"
          cp package-lock.json "release-assets/yukh-projects-lock-${RELEASE_VERSION}.json"
          cp release.spdx.json "release-assets/yukh-projects-${RELEASE_VERSION}.spdx.json"
          cp would-publish.json release-assets/would-publish.json
          (cd release-assets && sha256sum yukh-projects-* > "yukh-projects-${RELEASE_VERSION}.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: release-assets
      - name: Recheck binding and publish once
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          IMMUTABLE_RELEASES_READ_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${#RELEASE_COMMIT}" -eq 40
          case "$RELEASE_COMMIT" in *[!0-9a-f]*) exit 1 ;; esac
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/publish-release.mjs "$RELEASE_VERSION" "$RELEASE_COMMIT" release-assets
      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/yukh-projects-*
